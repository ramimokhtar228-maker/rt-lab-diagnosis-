<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة التشخيص الذكي - RT Labs</title>
<meta name="theme-color" content="#0B0B0D">
<meta name="description" content="منصة دعم القرار الإكلينيكي بالذكاء الاصطناعي - معامل RT">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0D;
    --surface: #17181B;
    --surface-2: #1E1F23;
    --ink: #F2F0EC;
    --ink-soft: #A7ACB0;
    --teal: #A81E1E;
    --teal-deep: #170808;
    --teal-tint: #2A1214;
    --accent: #2E6FE0;
    --accent-tint: #142236;
    --danger: #FF5A46;
    --danger-tint: #2E1310;
    --ok: #4C8DEE;
    --border: #2B2C31;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 6px 18px rgba(0,0,0,0.35);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
    font-size: 15px; line-height: 1.65;
  }
  h1, h2, h3, .serif { font-family: 'Amiri', Georgia, serif; }
  .app { display: flex; min-height: 100vh; }
  /* Sidebar */
  .sidebar {
    width: 300px; flex-shrink: 0; background: var(--teal-deep); color: #EFF5F3;
    padding: 28px 22px; display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand h1 { font-size: 22px; margin: 0; color: #fff; font-weight: 700; }
  .brand span { font-size: 13px; color: #B9D3CC; }
  .new-case-btn {
    background: var(--accent); color: #211705; border: none; border-radius: 10px;
    padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: filter .15s ease;
  }
  .new-case-btn:hover { filter: brightness(1.08); }
  .case-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .case-list-title { font-size: 13px; color: #9DBAB2; margin: 6px 2px; }
  .case-item {
    text-align: right; background: transparent; border: 1px solid transparent; color: #DCEAE6;
    padding: 10px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .case-item:hover { background: rgba(255,255,255,0.06); }
  .case-item.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.15); }
  .case-item .meta { font-size: 12px; color: #9DBAB2; }
  .status-pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; margin-top: 3px; width: fit-content; }
  .status-pill.draft { background: rgba(255,255,255,0.1); color: #DCEAE6; }
  .status-pill.pending { background: #4A3B18; color: #F1CD84; }
  .status-pill.reviewed { background: #16362A; color: #8FE0B4; }
  .empty-hint { font-size: 13px; color: #82A69D; padding: 6px 2px; }

  /* Main */
  .main { flex: 1; padding: 32px 40px; max-width: 980px; width: 100%; margin: 0 auto; }
  .top-note {
    background: var(--teal-tint); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 24px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .top-note b { color: var(--teal); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 26px 28px; box-shadow: var(--shadow); margin-bottom: 22px;
  }
  .card h2 { font-size: 20px; margin: 0 0 4px; }
  .card .sub { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 18px; }
  label { display: block; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 500; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--ink); font-family: inherit; font-size: 14.5px;
  }
  textarea { resize: vertical; min-height: 90px; }
  .row { display: grid; gap: 16px; margin-bottom: 16px; }
  .row.cols-2 { grid-template-columns: 1fr 1fr; }
  .row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 720px) { .row.cols-2, .row.cols-3 { grid-template-columns: 1fr; } .main { padding: 20px; } }
  .field { margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th { text-align: right; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--teal-tint); }
  td { padding: 6px; border-bottom: 1px solid var(--border); }
  td input { border: 1px solid transparent; background: transparent; padding: 7px 8px; }
  td input:focus { border-color: var(--border); background: var(--surface); }
  .row-remove { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 18px; padding: 4px 8px; }
  .add-row-btn {
    margin-top: 10px; background: var(--teal-tint); color: var(--teal); border: 1px dashed var(--teal);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 600;
  }
  .upload-zone {
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 18px; text-align: center;
    color: var(--ink-soft); font-size: 13.5px; cursor: pointer; background: var(--bg);
  }
  .upload-zone:hover { border-color: var(--teal); color: var(--teal); }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .attachment-chip {
    display: flex; align-items: center; gap: 6px; background: var(--teal-tint); color: var(--teal);
    padding: 6px 10px; border-radius: 20px; font-size: 12.5px;
  }
  .attachment-chip a { color: inherit; text-decoration: underline; }
  .actions { display: flex; gap: 12px; justify-content: flex-start; margin-top: 6px; }
  .btn-primary {
    background: var(--teal); color: #fff; border: none; border-radius: 10px; padding: 12px 22px;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-secondary {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 20px; font-family: inherit; font-size: 14.5px; cursor: pointer;
  }
  .loading-line { display: flex; align-items: center; gap: 10px; color: var(--teal); font-size: 14px; margin-top: 10px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--teal-tint); border-top-color: var(--teal); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Report */
  .report-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
  .patient-tag { font-size: 13.5px; color: var(--ink-soft); }
  .disclaimer {
    background: var(--accent-tint); border: 1px solid var(--accent); border-radius: 10px;
    padding: 12px 16px; font-size: 13px; color: var(--ok); margin-bottom: 20px;
  }
  :root[data-theme="dark"] .disclaimer, @media (prefers-color-scheme: dark) { }
  .report-section { margin-bottom: 20px; }
  .report-section h3 { font-size: 16.5px; margin: 0 0 8px; color: var(--teal); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .report-section p, .report-section li { color: var(--ink); font-size: 14.5px; }
  .report-section ul { margin: 6px 0; padding-inline-start: 20px; }
  .flag-list { display: flex; flex-direction: column; gap: 6px; }
  .flag-item { background: var(--danger-tint); color: var(--danger); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
  .review-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border-top: 1px solid var(--border); margin-top: 22px; padding-top: 18px;
  }
  .review-status { font-size: 13.5px; }
  .review-status.pending { color: var(--accent); }
  .review-status.reviewed { color: var(--ok); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state h2 { color: var(--ink); }
  .small-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; max-width: 460px; width: 100%; box-shadow: var(--shadow); }
  .modal h2 { font-size: 18px; margin: 0 0 6px; }
  .modal .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-start; }
  .install-banner {
    background: var(--teal-tint); border: 1px solid var(--teal); border-radius: 10px; padding: 12px 16px;
    font-size: 13px; color: var(--ink); margin-bottom: 20px; display: none; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .install-banner button { background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 13px; cursor: pointer; }

  /* Picker (symptoms / meds / labs quick-select) */
  .picker { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .picker-group { border-top: 1px solid var(--border); }
  .picker-group:first-child { border-top: none; }
  .picker-group summary {
    list-style: none; cursor: pointer; padding: 11px 14px; font-size: 14px; font-weight: 600;
    color: var(--teal); background: var(--teal-tint); display: flex; justify-content: space-between; align-items: center;
  }
  .picker-group summary::-webkit-details-marker { display: none; }
  .picker-group summary .count { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .picker-options { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
  .pick-chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .pick-chip.selected { background: var(--teal); border-color: var(--teal); color: #fff; }
  .selected-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }
  .selected-chip {
    display: flex; align-items: center; gap: 6px; background: var(--accent-tint); color: var(--ok);
    padding: 6px 10px 6px 6px; border-radius: 20px; font-size: 13px;
  }
  .selected-chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .manual-add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .manual-add-row input { flex: 1; }
  .manual-add-row button { white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>منصة التشخيص الذكي</h1>
      <span>مختبرات RT &middot; دعم القرار الإكلينيكي</span>
    </div>
    <button class="new-case-btn" id="newCaseBtn">+ حالة جديدة</button>
    <div>
      <div class="case-list-title">الحالات</div>
      <div class="case-list" id="caseList"><div class="empty-hint">جارِ التحميل…</div></div>
    </div>
    <button class="btn-secondary" id="settingsBtn" style="margin-top:auto; color:#DCEAE6; border-color:rgba(255,255,255,0.2);">⚙️ إعدادات الذكاء الاصطناعي</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="settingsModal" style="display:none;"></div>

<script>
let cases = {};
const LS_CASES_KEY = 'rtlabs_cases_v1';
const LS_APIKEY_KEY = 'rtlabs_api_key_v1';
let currentCaseId = null;
let currentDraft = null; // unsaved form state for a new case

/* ---------- Reference data: symptoms by system, meds by category, labs by category ---------- */
const SYMPTOMS_BY_SYSTEM = {
  'عام / General': ['حمى', 'إرهاق عام', 'فقدان وزن', 'زيادة وزن', 'فقدان شهية', 'تعرق ليلي', 'قشعريرة', 'دوخة عامة', 'ضعف عام'],
  'القلب والأوعية / Cardiovascular': ['ألم صدر', 'خفقان', 'ضيق نفس مجهودي', 'تورم بالقدمين', 'زرقان', 'ألم صدر عند المجهود', 'دوخة عند الوقوف'],
  'الجهاز التنفسي / Respiratory': ['سعال', 'سعال مصحوب ببلغم', 'سعال دموي', 'ضيق تنفس', 'صفير بالصدر', 'ألم بالصدر عند التنفس', 'التهاب حلق'],
  'الجهاز الهضمي / GI': ['ألم بطن', 'غثيان', 'قيء', 'إسهال', 'إمساك', 'انتفاخ', 'حرقان بالمعدة', 'صعوبة بلع', 'نزيف بالبراز', 'اصفرار الجلد (يرقان)'],
  'الجهاز البولي والكلى / Renal-Urinary': ['حرقان بالبول', 'كثرة التبول', 'دم بالبول', 'ألم بالخاصرة', 'تورم بالوجه/الجسم', 'قلة كمية البول'],
  'الغدد الصماء والتمثيل الغذائي / Endocrine': ['عطش شديد', 'جوع مفرط', 'تعب مع فقدان وزن', 'عدم تحمل حرارة', 'عدم تحمل برودة', 'رعشة أطراف', 'تساقط شعر'],
  'الجهاز العصبي / Neurological': ['صداع', 'دوخة/دوار', 'تنميل أطراف', 'ضعف بطرف', 'تشنجات', 'فقدان وعي', 'اضطراب رؤية', 'اضطراب كلام', 'اضطراب توازن'],
  'العظام والمفاصل / Musculoskeletal': ['ألم مفاصل', 'تورم مفصل', 'ألم عضلي', 'تيبس صباحي', 'ألم أسفل الظهر', 'محدودية حركة'],
  'الجلد / Dermatology': ['طفح جلدي', 'حكة', 'احمرار جلدي', 'تقرحات جلدية', 'تغير لون الجلد'],
  'الأنف والأذن والحنجرة / ENT': ['احتقان أنف', 'رشح', 'ألم أذن', 'طنين أذن', 'فقدان سمع', 'بحة صوت'],
  'العين / Ophthalmology': ['احمرار عين', 'ألم عين', 'اضطراب رؤية', 'إفرازات من العين'],
  'النفسي / Psychiatric': ['قلق', 'اكتئاب مزاجي', 'اضطراب نوم', 'توتر', 'صعوبة تركيز'],
  'النساء والتوليد / Gynecology': ['اضطراب دورة شهرية', 'نزيف غير طبيعي', 'ألم حوضي', 'إفرازات مهبلية غير طبيعية'],
  'الدم والمناعة / Hematology-Immunology': ['شحوب', 'كدمات سهلة', 'نزيف متكرر', 'تضخم غدد ليمفاوية', 'التهابات متكررة']
};

const MEDS_BY_CATEGORY = {
  'مسكنات ومضادات التهاب / Analgesics-NSAIDs': ['Paracetamol', 'Ibuprofen', 'Diclofenac', 'Aspirin', 'Mefenamic acid'],
  'مضادات حيوية / Antibiotics': ['Amoxicillin', 'Amoxicillin-Clavulanate', 'Azithromycin', 'Ciprofloxacin', 'Cefixime', 'Metronidazole', 'Levofloxacin'],
  'قلب وضغط / Cardiac-Antihypertensive': ['Amlodipine', 'Atenolol', 'Bisoprolol', 'Losartan', 'Valsartan', 'Enalapril', 'Furosemide', 'Atorvastatin', 'Aspirin (cardio dose)'],
  'سكر / Antidiabetic': ['Metformin', 'Glimepiride', 'Insulin', 'Sitagliptin', 'Empagliflozin'],
  'جهاز هضمي / GI': ['Omeprazole', 'Esomeprazole', 'Domperidone', 'Mebeverine', 'Loperamide'],
  'تنفسي / Respiratory': ['Salbutamol inhaler', 'Montelukast', 'Budesonide inhaler', 'Cetirizine', 'Loratadine'],
  'نفسي وعصبي / Psychiatric-Neuro': ['Sertraline', 'Escitalopram', 'Alprazolam', 'Gabapentin', 'Pregabalin'],
  'غدد صماء / Endocrine': ['Levothyroxine', 'Carbimazole', 'Prednisolone'],
  'مكملات / Supplements': ['Vitamin D3', 'Vitamin B12', 'Iron supplement', 'Folic acid', 'Calcium supplement', 'Multivitamin']
};

const LABS_BY_CATEGORY = {
  'صورة دم كاملة / CBC': ['WBC', 'RBC', 'HGB', 'HCT', 'PLT', 'MCV', 'MCH', 'MCHC', 'RDW', 'Neutrophils %', 'Lymphocytes %', 'Monocytes %', 'Eosinophils %', 'Basophils %'],
  'وظائف كلى وأملاح / Renal-Electrolytes': ['Urea', 'Creatinine', 'eGFR', 'Uric acid', 'Na', 'K', 'Cl', 'Ca', 'Phosphorus', 'Mg'],
  'وظائف كبد / Liver Function': ['ALT (SGPT)', 'AST (SGOT)', 'ALP', 'GGT', 'Total Bilirubin', 'Direct Bilirubin', 'Indirect Bilirubin', 'Total Protein', 'Albumin', 'Globulin'],
  'سكر / Glucose-Metabolic': ['FBS', 'RBS', '2h PP', 'HbA1c', 'Insulin level'],
  'دهون / Lipid Profile': ['Total Cholesterol', 'Triglycerides', 'HDL', 'LDL', 'VLDL'],
  'غدة درقية / Thyroid': ['TSH', 'FT3', 'FT4', 'T3', 'T4', 'Anti-TPO', 'Anti-Tg'],
  'مناعة والتهابات / Immunology-Inflammation': ['CRP', 'ESR', 'RF', 'ANA', 'Anti-dsDNA', 'C3', 'C4', 'IgG', 'IgA', 'IgM', 'IgE', 'ASOT'],
  'فيروسات وأمصال / Serology': ['HBsAg', 'Anti-HBs', 'Anti-HBc', 'Anti-HCV', 'HIV Ab', 'VDRL', 'Widal test', 'Brucella Ab', 'CMV IgG', 'CMV IgM', 'Toxoplasma IgG', 'Toxoplasma IgM', 'Rubella IgG', 'Rubella IgM'],
  'دلالات أورام / Tumor Markers': ['AFP', 'CEA', 'CA19-9', 'CA125', 'CA15-3', 'PSA', 'Free PSA', 'Beta-hCG'],
  'تجلط / Coagulation': ['PT', 'PTT', 'INR', 'D-dimer', 'Fibrinogen', 'Bleeding time', 'Clotting time'],
  'هرمونات / Hormones': ['FSH', 'LH', 'Prolactin', 'Testosterone', 'Cortisol', 'Estradiol', 'Progesterone', 'Vitamin D', 'Vitamin B12', 'Ferritin', 'Serum Iron', 'TIBC', 'Folic acid'],
  'بول وبراز / Urine-Stool': ['Urine analysis', 'Urine culture', 'Microalbumin', 'Stool analysis', 'Stool occult blood'],
  'أخرى / Others': ['Amylase', 'Lipase', 'Procalcitonin', 'Homocysteine', 'LDH', 'CK', 'CK-MB', 'Troponin']
};

const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
const uid = () => 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function emptyDraft() {
  return {
    patientCode: '', age: '', gender: '',
    complaint: '', symptomsSelected: [], symptomsDetail: '',
    labs: [{ test: '', value: '', unit: '', ref: '' }],
    meds: [{ name: '', dose: '', freq: '' }],
    attachments: [],
    report: null, status: 'draft', createdAt: null, reviewedAt: null
  };
}

/* ---------- Local persistence (localStorage) ----------
   This standalone build (for GitHub Pages / installed app) has no server,
   so cases and attachments are stored in this browser only — not shared
   automatically between team members or devices. */
function loadCasesFromStorage() {
  try {
    const raw = localStorage.getItem(LS_CASES_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function persistCasesToStorage() {
  try { localStorage.setItem(LS_CASES_KEY, JSON.stringify(cases)); }
  catch(e) { alert('تعذر الحفظ محليًا - مساحة التخزين ممتلئة. جرّب حذف مرفقات كبيرة من حالات قديمة.'); }
}

function getApiKey() { return localStorage.getItem(LS_APIKEY_KEY) || ''; }
function setApiKey(k) { if (k) localStorage.setItem(LS_APIKEY_KEY, k); else localStorage.removeItem(LS_APIKEY_KEY); }

async function callClaude(promptText) {
  const key = getApiKey();
  if (!key) { const e = new Error('no_key'); e.code = 'no_key'; throw e; }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1800,
      messages: [{ role: 'user', content: promptText }]
    })
  });
  if (!res.ok) {
    const errBody = await res.json().catch(() => ({}));
    const e = new Error(errBody?.error?.message || 'request_failed');
    e.code = res.status;
    throw e;
  }
  const data = await res.json();
  const text = (data.content || []).map(b => b.text || '').join('\n');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

/* ---------- PWA: install prompt + service worker ---------- */
let deferredInstallPrompt = null;
function setupInstallPrompt() {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const note = $('.top-note');
    if (note) showInstallBanner();
  });
}
function showInstallBanner() {
  const banner = document.createElement('div');
  banner.className = 'install-banner';
  banner.style.display = 'flex';
  banner.innerHTML = `<span>ثبّت المنصة كتطبيق على جهازك للوصول السريع</span><button id="installAppBtn">تثبيت</button>`;
  const note = $('.top-note');
  if (note) note.parentNode.insertBefore(banner, note);
  $('#installAppBtn')?.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    banner.remove();
  });
}
function registerServiceWorker() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
}

function renderCaseList() {
  const list = $('#caseList');
  const ids = Object.keys(cases).sort((a,b) => (cases[b].createdAt||0) - (cases[a].createdAt||0));
  if (ids.length === 0) {
    list.innerHTML = '<div class="empty-hint">لا توجد حالات محفوظة بعد</div>';
    return;
  }
  list.innerHTML = '';
  ids.forEach(id => {
    const c = cases[id];
    const div = document.createElement('button');
    div.className = 'case-item' + (id === currentCaseId ? ' active' : '');
    const statusLabel = c.status === 'reviewed' ? 'تمت المراجعة' : (c.status === 'pending' ? 'بانتظار المراجعة' : 'مسودة');
    div.innerHTML = `<span>${escapeHtml(c.patientCode || 'حالة بدون كود')}</span>
      <span class="meta">${escapeHtml((c.complaint||'').slice(0,40) || 'بدون شكوى')}</span>
      <span class="status-pill ${c.status||'draft'}">${statusLabel}</span>`;
    div.addEventListener('click', () => {
      currentCaseId = id;
      currentDraft = null;
      renderCaseView(id);
      renderCaseList();
    });
    list.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderPicker(containerId, dataByGroup, onPick, isSelected) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  Object.keys(dataByGroup).forEach(group => {
    const items = dataByGroup[group];
    const details = document.createElement('details');
    details.className = 'picker-group';
    const selCount = items.filter(isSelected).length;
    details.innerHTML = `<summary>${group} <span class="count">${selCount ? selCount + ' مختار' : items.length + ' عنصر'}</span></summary>
      <div class="picker-options">${items.map(v => `<button type="button" class="pick-chip ${isSelected(v)?'selected':''}" data-v="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('')}</div>`;
    el.appendChild(details);
  });
  $$('.pick-chip', el).forEach(btn => btn.addEventListener('click', () => onPick(btn.dataset.v)));
}

function toggleSymptom(val) {
  const d = currentDraft;
  const i = d.symptomsSelected.indexOf(val);
  if (i === -1) d.symptomsSelected.push(val); else d.symptomsSelected.splice(i, 1);
  renderSymptomChips();
  renderPicker('symptomPicker', SYMPTOMS_BY_SYSTEM, (v) => toggleSymptom(v), (v) => d.symptomsSelected.includes(v));
}

function renderSymptomChips() {
  const d = currentDraft;
  const wrap = $('#symptomChips');
  if (!wrap) return;
  if (!d.symptomsSelected.length) { wrap.innerHTML = '<span class="small-note">لم يتم اختيار أعراض من القوائم بعد</span>'; return; }
  wrap.innerHTML = d.symptomsSelected.map((v, i) => `<span class="selected-chip">${escapeHtml(v)}<button data-i="${i}">×</button></span>`).join('');
  $$('#symptomChips button', wrap).forEach(btn => btn.addEventListener('click', () => {
    d.symptomsSelected.splice(+btn.dataset.i, 1); renderSymptomChips();
    renderPicker('symptomPicker', SYMPTOMS_BY_SYSTEM, (v) => toggleSymptom(v), (v) => d.symptomsSelected.includes(v));
  }));
}

function quickAddMed(name) {
  const d = currentDraft;
  d.meds.push({ name, dose: '', freq: '' });
  renderMedRows(d.meds);
}

function quickAddLab(name) {
  const d = currentDraft;
  if (d.labs.some(l => l.test === name)) return;
  // remove a trailing empty manual row if present, then add
  if (d.labs.length === 1 && !d.labs[0].test) d.labs = [];
  d.labs.push({ test: name, value: '', unit: '', ref: '' });
  renderLabRows(d.labs);
  renderPicker('labPicker', LABS_BY_CATEGORY, (v) => quickAddLab(v), (v) => d.labs.some(l => l.test === v));
}

function renderLabRows(labs) {
  const tbody = $('#labsTable tbody');
  tbody.innerHTML = '';
  labs.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(row.test)}" data-f="test" data-i="${i}" placeholder="مثال: هيموجلوبين"></td>
      <td><input type="text" value="${escapeHtml(row.value)}" data-f="value" data-i="${i}" placeholder="القيمة"></td>
      <td><input type="text" value="${escapeHtml(row.unit)}" data-f="unit" data-i="${i}" placeholder="الوحدة"></td>
      <td><input type="text" value="${escapeHtml(row.ref)}" data-f="ref" data-i="${i}" placeholder="المعدل الطبيعي"></td>
      <td>${labs.length>1 ? `<button class="row-remove" data-i="${i}">×</button>` : ''}</td>`;
    tbody.appendChild(tr);

  $$('#labsTable input').forEach(inp => inp.addEventListener('input', e => {
    labs[+e.target.dataset.i][e.target.dataset.f] = e.target.value;

function renderMedRows(meds) {

    meds[+e.target.dataset.i][e.target.dataset.f] = e.target.value;

function renderAttachments(list) {
  const wrap = $('#attachmentsList');
  if (!wrap) return;
  wrap.innerHTML = '';
  list.forEach((a, i) => {
    const chip = document.createElement('div');
    chip.className = 'attachment-chip';
    chip.innerHTML = `<a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a> <button class="row-remove" data-i="${i}" style="font-size:14px;">×</button>`;
    wrap.appendChild(chip);
  });
  $$('#attachmentsList .row-remove').forEach(btn => btn.addEventListener('click', e => {

async function handleFileUpload(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  for (const file of files) {
    if (file.size > 4 * 1024 * 1024) {
      alert(`الملف "${file.name}" أكبر من ٤ ميجا — تخزين المرفقات هنا محلي في المتصفح ومساحته محدودة، فضّل ملفات أصغر`);
      continue;
    }
    try {
      const dataUrl = await fileToDataUrl(file);
      currentDraft.attachments.push({ url: dataUrl, name: file.name, contentType: file.type });
    } catch(err) {
      console.error('upload failed', err);
    }
  }
  renderAttachments(currentDraft.attachments);
  e.target.value = '';
}

/* ---------- Generate report ---------- */
async function generateReport() {
  const d = currentDraft;
  d.patientCode = $('#f_code').value;
  d.age = $('#f_age').value;
  d.gender = $('#f_gender').value;
  d.complaint = $('#f_complaint').value;
  d.symptomsDetail = $('#f_symptoms').value;

  if (!d.complaint && !d.symptomsDetail && !d.symptomsSelected.length) {
    alert('برجاء إدخال الشكوى أو اختيار عرض واحد على الأقل');
    return;
  }
  if (!getApiKey()) {
    openSettingsModal();
    return;
  }

  const genBtn = $('#generateBtn');
  genBtn.disabled = true;
  const statusEl = $('#genStatus');
  statusEl.innerHTML = `<div class="loading-line"><div class="spinner"></div> جارٍ تحليل الحالة وتوليد التقرير…</div>`;

  const labsText = d.labs.filter(l=>l.test).map(l => `- ${l.test}: ${l.value} ${l.unit} (المعدل الطبيعي: ${l.ref||'غير محدد'})`).join('\n') || 'لا توجد تحاليل مدخلة';
  const medsText = d.meds.filter(m=>m.name).map(m => `- ${m.name} ${m.dose} ${m.freq}`).join('\n') || 'لا توجد أدوية مسجلة';

  const prompt = `أنت مساعد إكلينيكي لطبيب باثولوجيا إكلينيكية. حلل الحالة التالية وقدم تقريرًا منظمًا كمساعدة لقرار الطبيب (وليس تشخيصًا نهائيًا). أجب بصيغة JSON فقط بدون أي نص إضافي، بالمفاتيح التالية بالعربية كنصوص:
{
 "summary_for_patient": "شرح مبسط وواضح لحالة المريض بلغة يفهمها غير المتخصص",
 "clinical_interpretation": "تفسير إكلينيكي للأعراض ونتائج التحاليل مجتمعة، بلغة طبية دقيقة للطبيب",
 "differential_diagnosis": ["احتمال تشخيصي ١", "احتمال تشخيصي ٢", "..."],
 "recommended_further_tests": ["تحليل أو فحص مقترح ١", "..."],
 "red_flags": ["علامة خطر تستدعي تدخل عاجل إن وجدت"],
 "therapeutic_guidance": "توجيهات علاجية عامة مبدئية (ليست وصفة نهائية) تحتاج اعتماد الطبيب",
 "nutritional_guidance": "توصيات غذائية مفصلة مناسبة للحالة"
}

بيانات المريض:
السن: ${d.age || 'غير محدد'} | النوع: ${d.gender || 'غير محدد'}

الشكوى الرئيسية: ${d.complaint}

الأعراض المختارة: ${d.symptomsSelected.length ? d.symptomsSelected.join('، ') : 'لا يوجد'}

ملاحظات إضافية عن الأعراض:
${d.symptomsDetail || 'لا يوجد'}

نتائج التحاليل:
${labsText}

الأدوية الحالية:
${medsText}

تذكير: إن كانت البيانات غير كافية لتشخيص واضح، وضّح ذلك صراحة في clinical_interpretation واقترح ما يلزم من فحوصات إضافية بدلاً من التخمين.`;

  try {
    const result = await callClaude(prompt);
    d.report = result;
    d.status = 'pending';
    d.createdAt = d.createdAt || Date.now();
    await saveCase(d);
    genBtn.disabled = false;
    statusEl.innerHTML = '';
    renderCaseView(currentCaseId);
    renderCaseList();
  } catch (err) {
    console.error(err);
    genBtn.disabled = false;
    let msg = 'تعذر توليد التقرير، برجاء المحاولة مرة أخرى';
    if (err.code === 'no_key' || err.code === 401) msg = 'مفتاح API غير صحيح أو غير موجود — راجع الإعدادات';
    else if (err.code === 429) msg = 'تم تجاوز الحد المسموح من الطلبات، حاول بعد قليل';
    statusEl.innerHTML = `<div class="loading-line" style="color:var(--danger)">${msg}</div>`;
  }
}

  const id = currentCaseId || uid();
  currentCaseId = id;
  cases[id] = JSON.parse(JSON.stringify(d));
  persistCasesToStorage();
}

      <h2 class="serif" style="font-size:17px;">الشكوى والبيانات المدخلة</h2>
      <p><b>الشكوى:</b> ${escapeHtml(c.complaint)}</p>
      ${(c.symptomsSelected&&c.symptomsSelected.length) ? `<p><b>الأعراض:</b> ${c.symptomsSelected.map(escapeHtml).join('، ')}</p>` : ''}
      <p>${escapeHtml(c.symptomsDetail)}</p>
      ${labsText ? `<div class="table-wrap"><table><thead><tr><th>التحليل</th><th>القيمة</th><th>المعدل</th></tr></thead><tbody>${labsText}</tbody></table></div>` : ''}
      ${medsText ? `<div style="margin-top:12px;"><b>الأدوية:</b><ul>${medsText}</ul></div>` : ''}
      ${(c.attachments&&c.attachments.length) ? `<div class="attachments" style="margin-top:12px;">${c.attachments.map(a=>`<div class="attachment-chip"><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a></div>`).join('')}</div>` : ''}
    </div>

    ${r ? `
    <div class="card">
      <div class="disclaimer">هذا التقرير أُنشئ بمساعدة الذكاء الاصطناعي كأداة دعم قرار، ويجب مراجعته واعتماده من الطبيب المختص قبل الاعتماد عليه في القرار الإكلينيكي أو مشاركته مع المريض.</div>

      ${r.red_flags && r.red_flags.length ? `<div class="report-section"><h3 class="serif">علامات تستدعي انتباهًا عاجلاً</h3><div class="flag-list">${r.red_flags.map(f=>`<div class="flag-item">${escapeHtml(f)}</div>`).join('')}</div></div>` : ''}

      <div class="report-section"><h3 class="serif">شرح الحالة للمريض</h3><p>${escapeHtml(r.summary_for_patient||'')}</p></div>
      <div class="report-section"><h3 class="serif">التفسير الإكلينيكي</h3><p>${escapeHtml(r.clinical_interpretation||'')}</p></div>
      ${r.differential_diagnosis && r.differential_diagnosis.length ? `<div class="report-section"><h3 class="serif">التشخيص التفريقي المحتمل</h3><ul>${r.differential_diagnosis.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : ''}
      ${r.recommended_further_tests && r.recommended_further_tests.length ? `<div class="report-section"><h3 class="serif">فحوصات مقترحة</h3><ul>${r.recommended_further_tests.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="report-section"><h3 class="serif">التوجيه العلاجي المبدئي</h3><p>${escapeHtml(r.therapeutic_guidance||'')}</p></div>
      <div class="report-section"><h3 class="serif">التوصيات الغذائية</h3><p>${escapeHtml(r.nutritional_guidance||'')}</p></div>

      <div class="review-bar">
        <div class="review-status ${c.status==='reviewed'?'reviewed':'pending'}">
          ${c.status==='reviewed' ? 'تمت مراجعة هذا التقرير واعتماده' : 'بانتظار مراجعة الطبيب واعتماد التقرير'}
        </div>
        ${c.status!=='reviewed' ? `<button class="btn-primary" id="reviewBtn">اعتماد التقرير بعد المراجعة</button>` : ''}
      </div>
    </div>
    ` : `<div class="card"><p class="small-note">لم يتم توليد تقرير بعد لهذه الحالة.</p></div>`}
  `;

  $('#backBtn').addEventListener('click', () => {
    currentCaseId = null; currentDraft = emptyDraft(); renderMainForm(); renderCaseList();
  });
  const reviewBtn = $('#reviewBtn');
  if (reviewBtn) reviewBtn.addEventListener('click', async () => {
    c.status = 'reviewed';
    c.reviewedAt = Date.now();
    await saveCase(c);
    renderCaseView(id);
    renderCaseList();
  });
}

init();
</script>
</body>
</html>
