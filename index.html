<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>منصة التشخيص الذكي - RT Labs</title>
<meta name="theme-color" content="#0D7377">
<meta name="description" content="منصة دعم القرار الإكلينيكي لمعامل RT — تشخيص احترافي مجاني">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --bg: #F4F7F9;
    --surface: #FFFFFF;
    --surface-2: #EEF3F6;
    --ink: #1A2B3C;
    --ink-soft: #5A6A7A;
    --primary: #0D7377;
    --primary-deep: #095456;
    --primary-tint: #E6F4F4;
    --accent: #14919B;
    --accent-tint: #E0F5F7;
    --danger: #C0392B;
    --danger-tint: #FDEDEC;
    --warn: #D68910;
    --warn-tint: #FEF5E7;
    --ok: #1E8449;
    --ok-tint: #E8F8F0;
    --border: #D5DEE7;
    --shadow: 0 1px 3px rgba(26,43,60,0.06), 0 4px 14px rgba(26,43,60,0.05);
    --sidebar-bg: linear-gradient(180deg, #0D7377 0%, #095456 100%);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
    font-size: 15px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif { font-family: 'Amiri', Georgia, serif; }
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--sidebar-bg); color: #EFF8F8;
    padding: 24px 18px; display: flex; flex-direction: column; gap: 16px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding-top: max(24px, env(safe-area-inset-top));
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand h1 { font-size: 20px; margin: 0; color: #fff; font-weight: 700; }
  .brand span { font-size: 12.5px; color: #A8D5D7; }
  .new-case-btn {
    background: #fff; color: var(--primary-deep); border: none; border-radius: 10px;
    padding: 11px 14px; font-size: 14.5px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: transform .12s, box-shadow .12s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .new-case-btn:hover { transform: translateY(-1px); }
  .case-list { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; flex: 1; }
  .case-list-title { font-size: 12px; color: #A8D5D7; margin: 4px 2px; letter-spacing: 0.3px; }
  .case-item {
    text-align: right; background: transparent; border: 1px solid transparent; color: #E8F6F6;
    padding: 9px 11px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13.5px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .case-item:hover { background: rgba(255,255,255,0.1); }
  .case-item.active { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.25); }
  .case-item .meta { font-size: 11.5px; color: #A8D5D7; }
  .status-pill { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 20px; margin-top: 3px; width: fit-content; }
  .status-pill.draft { background: rgba(255,255,255,0.15); color: #E8F6F6; }
  .status-pill.pending { background: #5C4A1A; color: #F5D78E; }
  .status-pill.reviewed { background: #1A4A35; color: #8FE0B4; }
  .empty-hint { font-size: 12.5px; color: #8EC4C6; padding: 6px 2px; }

  .main { flex: 1; padding: 28px 36px; max-width: 960px; width: 100%; margin: 0 auto; }
  .top-note {
    background: var(--primary-tint); border: 1px solid #B8DEDF; border-radius: 12px;
    padding: 13px 16px; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 20px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .top-note b { color: var(--primary); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .card h2 { font-size: 19px; margin: 0 0 3px; color: var(--ink); }
  .card .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 5px; font-weight: 500; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 14.5px;
    transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  textarea { resize: vertical; min-height: 80px; }
  .row { display: grid; gap: 14px; margin-bottom: 14px; }
  .row.cols-2 { grid-template-columns: 1fr 1fr; }
  .row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .field { margin-bottom: 14px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th { text-align: right; font-size: 12px; color: var(--ink-soft); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  td { padding: 5px; border-bottom: 1px solid var(--border); }
  td input { border: 1px solid transparent; background: transparent; padding: 7px 8px; }
  td input:focus { border-color: var(--border); background: var(--surface-2); }
  .row-remove { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 17px; padding: 4px 8px; }
  .add-row-btn {
    margin-top: 8px; background: var(--primary-tint); color: var(--primary); border: 1px dashed var(--primary);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
  }
  .upload-zone {
    border: 1.5px dashed var(--border); border-radius: 10px; padding: 16px; text-align: center;
    color: var(--ink-soft); font-size: 13.5px; cursor: pointer; background: var(--surface-2);
  }
  .upload-zone:hover { border-color: var(--primary); color: var(--primary); }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .attachment-chip {
    display: flex; align-items: center; gap: 6px; background: var(--primary-tint); color: var(--primary);
    padding: 5px 10px; border-radius: 20px; font-size: 12.5px;
  }
  .attachment-chip a { color: inherit; text-decoration: underline; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start; margin-top: 4px; }
  .btn-primary {
    background: var(--primary); color: #fff; border: none; border-radius: 10px; padding: 11px 20px;
    font-family: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .btn-primary:hover { background: var(--primary-deep); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-secondary {
    background: var(--surface); color: var(--ink-soft); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 18px; font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .btn-secondary:hover { background: var(--surface-2); }
  .btn-pdf {
    background: var(--ok); color: #fff; border: none; border-radius: 10px; padding: 11px 18px;
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-pdf:hover { filter: brightness(1.08); }
  .loading-line { display: flex; align-items: center; gap: 10px; color: var(--primary); font-size: 14px; margin-top: 10px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--primary-tint); border-top-color: var(--primary); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .report-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .patient-tag { font-size: 13.5px; color: var(--ink-soft); }
  .disclaimer {
    background: var(--warn-tint); border: 1px solid #F0D9A8; border-radius: 10px;
    padding: 12px 15px; font-size: 13px; color: #7D5A12; margin-bottom: 18px;
  }
  .report-section { margin-bottom: 18px; }
  .report-section h3 { font-size: 16px; margin: 0 0 8px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 7px; }
  .report-section p, .report-section li { color: var(--ink); font-size: 14.5px; }
  .report-section ul { margin: 6px 0; padding-inline-start: 20px; }
  .flag-list { display: flex; flex-direction: column; gap: 6px; }
  .flag-item { background: var(--danger-tint); color: var(--danger); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; }
  .abnormal-item { background: var(--warn-tint); color: #8B5E0A; border-radius: 8px; padding: 8px 12px; font-size: 13.5px; margin-bottom: 4px; }
  .ok-item { background: var(--ok-tint); color: var(--ok); border-radius: 8px; padding: 8px 12px; font-size: 13.5px; margin-bottom: 4px; }
  .review-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px;
  }
  .review-status { font-size: 13.5px; }
  .review-status.pending { color: var(--warn); }
  .review-status.reviewed { color: var(--ok); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state h2 { color: var(--ink); }
  .small-note { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(26,43,60,0.45); display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; max-width: 480px; width: 100%; box-shadow: var(--shadow); }
  .modal h2 { font-size: 18px; margin: 0 0 6px; }
  .modal .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-start; }
  .install-banner {
    background: var(--accent-tint); border: 1px solid #A8DDE2; border-radius: 10px; padding: 12px 15px;
    font-size: 13px; color: var(--ink); margin-bottom: 18px; display: none; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .install-banner button { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: 13px; cursor: pointer; }

  .picker { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .picker-group { border-top: 1px solid var(--border); }
  .picker-group:first-child { border-top: none; }
  .picker-group summary {
    list-style: none; cursor: pointer; padding: 10px 13px; font-size: 13.5px; font-weight: 600;
    color: var(--primary); background: var(--primary-tint); display: flex; justify-content: space-between; align-items: center;
  }
  .picker-group summary::-webkit-details-marker { display: none; }
  .picker-group summary .count { font-size: 11.5px; color: var(--ink-soft); font-weight: 500; }
  .picker-options { display: flex; flex-wrap: wrap; gap: 7px; padding: 11px 13px; }
  .pick-chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    padding: 5px 11px; border-radius: 20px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .pick-chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; }
  .selected-chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 4px 0 12px; }
  .selected-chip {
    display: flex; align-items: center; gap: 5px; background: var(--accent-tint); color: var(--primary-deep);
    padding: 5px 9px 5px 5px; border-radius: 20px; font-size: 12.5px;
  }
  .selected-chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
  .manual-add-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .manual-add-row input { flex: 1; }
  .manual-add-row button { white-space: nowrap; }

  .engine-badge {
    display: inline-flex; align-items: center; gap: 6px; background: var(--ok-tint); color: var(--ok);
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 10px;
  }
  .lab-flag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
  .lab-flag.high { background: var(--danger-tint); color: var(--danger); }
  .lab-flag.low { background: var(--warn-tint); color: var(--warn); }
  .lab-flag.normal { background: var(--ok-tint); color: var(--ok); }

  .menu-btn {
    display: none; position: fixed; top: 12px; right: 12px; z-index: 40;
    background: var(--primary); color: #fff; border: none; border-radius: 10px;
    width: 42px; height: 42px; font-size: 20px; cursor: pointer;
    box-shadow: var(--shadow); align-items: center; justify-content: center;
  }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 29;
  }

  @media (max-width: 800px) {
    .app { flex-direction: column; }
    .sidebar {
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 30;
      transform: translateX(105%); transition: transform .25s ease;
      width: min(300px, 85vw); box-shadow: -4px 0 20px rgba(0,0,0,0.15);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay.open { display: block; }
    .menu-btn { display: flex; }
    .main { padding: 16px 14px; padding-top: 60px; }
    .row.cols-2, .row.cols-3 { grid-template-columns: 1fr; }
  }

  @media print {
    .sidebar, .menu-btn, .install-banner, .actions, .review-bar, .btn-secondary, .btn-primary, .btn-pdf { display: none !important; }
    .main { max-width: 100%; padding: 0; }
    .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
  }
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>منصة التشخيص الذكي</h1>
      <span>معامل RT · دعم القرار الإكلينيكي</span>
    </div>
    <button class="new-case-btn" id="newCaseBtn">+ حالة جديدة</button>
    <div style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <div class="case-list-title">الحالات المحفوظة</div>
      <div class="case-list" id="caseList"><div class="empty-hint">جارِ التحميل…</div></div>
    </div>
    <button class="btn-secondary" id="settingsBtn" style="color:#E8F6F6; border-color:rgba(255,255,255,0.25); background:transparent;">⚙️ الإعدادات</button>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="settingsModal" style="display:none;"></div>

<script>
/* ========== Storage & State ========== */
let cases = {};
const LS_CASES_KEY = 'rtlabs_cases_v2';
const LS_SETTINGS_KEY = 'rtlabs_settings_v2';
let currentCaseId = null;
let currentDraft = null;

const DEFAULT_SETTINGS = {
  engine: 'local', // 'local' | 'groq' | 'gemini'
  groqKey: '',
  geminiKey: '',
  labName: 'معامل RT',
  doctorName: ''
};

function loadSettings() {
  try {
    const raw = localStorage.getItem(LS_SETTINGS_KEY);
    return raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : { ...DEFAULT_SETTINGS };
  } catch(e) { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) {
  localStorage.setItem(LS_SETTINGS_KEY, JSON.stringify(s));
}
let settings = loadSettings();

/* ========== Reference Ranges (adult) — professional lab standards ========== */
const REF_RANGES = {
  'WBC': { low: 4.0, high: 11.0, unit: '×10³/µL', nameAr: 'كرات الدم البيضاء' },
  'RBC': { low: 4.2, high: 5.9, unit: '×10⁶/µL', nameAr: 'كرات الدم الحمراء', gender: { 'ذكر': {low:4.5,high:5.9}, 'أنثى': {low:4.0,high:5.2} } },
  'HGB': { low: 12, high: 17, unit: 'g/dL', nameAr: 'الهيموجلوبين', gender: { 'ذكر': {low:13,high:17}, 'أنثى': {low:12,high:15} } },
  'HCT': { low: 36, high: 50, unit: '%', nameAr: 'الهيماتوكريت', gender: { 'ذكر': {low:40,high:50}, 'أنثى': {low:36,high:46} } },
  'PLT': { low: 150, high: 450, unit: '×10³/µL', nameAr: 'الصفائح الدموية' },
  'MCV': { low: 80, high: 100, unit: 'fL', nameAr: 'متوسط حجم الخلية' },
  'MCH': { low: 27, high: 33, unit: 'pg', nameAr: 'متوسط هيموجلوبين الخلية' },
  'MCHC': { low: 32, high: 36, unit: 'g/dL', nameAr: 'تركيز هيموجلوبين الخلية' },
  'RDW': { low: 11.5, high: 14.5, unit: '%', nameAr: 'توزيع حجم الخلايا' },
  'Neutrophils %': { low: 40, high: 70, unit: '%', nameAr: 'العدلات' },
  'Lymphocytes %': { low: 20, high: 40, unit: '%', nameAr: 'اللمفاويات' },
  'Monocytes %': { low: 2, high: 10, unit: '%', nameAr: 'الوحيدات' },
  'Eosinophils %': { low: 1, high: 6, unit: '%', nameAr: 'الحمضات' },
  'Basophils %': { low: 0, high: 2, unit: '%', nameAr: 'القاعدات' },
  'Urea': { low: 15, high: 45, unit: 'mg/dL', nameAr: 'اليوريا' },
  'Creatinine': { low: 0.6, high: 1.3, unit: 'mg/dL', nameAr: 'الكرياتينين', gender: { 'ذكر': {low:0.7,high:1.3}, 'أنثى': {low:0.6,high:1.1} } },
  'eGFR': { low: 90, high: 999, unit: 'mL/min', nameAr: 'معدل الترشيح الكلوي', invertHigh: true },
  'Uric acid': { low: 3.5, high: 7.2, unit: 'mg/dL', nameAr: 'حمض اليوريك' },
  'Na': { low: 135, high: 145, unit: 'mEq/L', nameAr: 'الصوديوم' },
  'K': { low: 3.5, high: 5.1, unit: 'mEq/L', nameAr: 'البوتاسيوم' },
  'Cl': { low: 98, high: 107, unit: 'mEq/L', nameAr: 'الكلوريد' },
  'Ca': { low: 8.5, high: 10.5, unit: 'mg/dL', nameAr: 'الكالسيوم' },
  'Phosphorus': { low: 2.5, high: 4.5, unit: 'mg/dL', nameAr: 'الفوسفور' },
  'Mg': { low: 1.7, high: 2.3, unit: 'mg/dL', nameAr: 'المغنيسيوم' },
  'ALT (SGPT)': { low: 7, high: 56, unit: 'U/L', nameAr: 'إنزيم الكبد ALT' },
  'AST (SGOT)': { low: 10, high: 40, unit: 'U/L', nameAr: 'إنزيم الكبد AST' },
  'ALP': { low: 40, high: 129, unit: 'U/L', nameAr: 'الفوسفاتاز القلوي' },
  'GGT': { low: 8, high: 61, unit: 'U/L', nameAr: 'جاما GT' },
  'Total Bilirubin': { low: 0.1, high: 1.2, unit: 'mg/dL', nameAr: 'البيليروبين الكلي' },
  'Direct Bilirubin': { low: 0, high: 0.3, unit: 'mg/dL', nameAr: 'البيليروبين المباشر' },
  'Indirect Bilirubin': { low: 0.1, high: 1.0, unit: 'mg/dL', nameAr: 'البيليروبين غير المباشر' },
  'Total Protein': { low: 6.0, high: 8.3, unit: 'g/dL', nameAr: 'البروتين الكلي' },
  'Albumin': { low: 3.5, high: 5.2, unit: 'g/dL', nameAr: 'الألبومين' },
  'Globulin': { low: 2.0, high: 3.5, unit: 'g/dL', nameAr: 'الجلوبيولين' },
  'FBS': { low: 70, high: 100, unit: 'mg/dL', nameAr: 'سكر صائم' },
  'RBS': { low: 70, high: 140, unit: 'mg/dL', nameAr: 'سكر عشوائي' },
  '2h PP': { low: 70, high: 140, unit: 'mg/dL', nameAr: 'سكر بعد الأكل بساعتين' },
  'HbA1c': { low: 4.0, high: 5.6, unit: '%', nameAr: 'السكر التراكمي' },
  'Total Cholesterol': { low: 0, high: 200, unit: 'mg/dL', nameAr: 'الكوليسترول الكلي' },
  'Triglycerides': { low: 0, high: 150, unit: 'mg/dL', nameAr: 'الدهون الثلاثية' },

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ========== Lab analysis engine (free, offline, professional) ========== */
function parseNum(v) {
  if (v == null || v === '') return null;
  const n = parseFloat(String(v).replace(/,/g, '').replace(/[^\d.\-]/g, ''));
  return isNaN(n) ? null : n;
}

function getRefFor(test, gender) {
  const r = REF_RANGES[test];
  if (!r) return null;
  if (r.gender && gender && r.gender[gender]) {
    return { ...r, low: r.gender[gender].low, high: r.gender[gender].high };
  }
  return r;
}

function evaluateLab(test, value, gender) {
  const num = parseNum(value);
  const ref = getRefFor(test, gender);
  if (num == null || !ref) return { status: 'unknown', flag: null, message: null };
  let status = 'normal';
  if (ref.invertHigh) {
    if (num < ref.low) status = 'low';
  } else {
    if (num < ref.low) status = 'low';
    else if (num > ref.high) status = 'high';
  }
  return {
    status,
    flag: status === 'high' ? 'مرتفع' : status === 'low' ? 'منخفض' : 'طبيعي',
    refText: `${ref.low} – ${ref.high} ${ref.unit}`,
    unit: ref.unit,
    nameAr: ref.nameAr || test
  };
}

  const labMap = {};

    if (!l.test) return;
    const ev = evaluateLab(l.test, l.value, gender);
    labMap[l.test] = { ...l, eval: ev };
    if (ev.status === 'high' || ev.status === 'low') {
      abnormal.push({ test: l.test, value: l.value, unit: l.unit || ev.unit, flag: ev.flag, ref: ev.refText, nameAr: ev.nameAr });
    } else if (ev.status === 'normal') {
      normal.push(l.test);

  // Anemia patterns

    interpretations.push('انخفاض الهيموجلوبين يشير إلى فقر دم. يلزم تحديد النوع حسب حجم الكرات (MCV) ومخزون الحديد.');
    differentials.push('فقر دم (يحتاج تصنيف: نقص حديد / نقص فيتامين ب12 أو فولات / مزمن / انحلالي)');
    if (mcv && mcv.eval.status === 'low') {
      interpretations.push('MCV منخفض (فقر دم صغير الكريات) — الأشيع: نقص الحديد أو ثلاسيميا خفيفة.');
      differentials.push('فقر دم بنقص الحديد');
      differentials.push('ثلاسيميا صغرى (يحتاج تحليل هيموجلوبين إلكتروفوريسيس عند الشك)');
      furtherTests.push('Ferritin', 'Serum Iron', 'TIBC', 'Peripheral blood film');
      nutrition.push('زيادة مصادر الحديد: اللحوم الحمراء، الكبدة، السبانخ مع فيتامين C لتحسين الامتصاص. تجنب الشاي مع الوجبات.');
      therapy.push('عند تأكيد نقص الحديد: مكمل حديد فموي بعد استشارة الطبيب، ومتابعة السبب (نزيف مزمن، دورة غزيرة، سوء امتصاص).');
    } else if (mcv && mcv.eval.status === 'high') {
      interpretations.push('MCV مرتفع (فقر دم كبير الكريات) — يُشتبه نقص ب12 أو حمض الفوليك أو أمراض كبد/نخاع.');
      differentials.push('فقر دم بنقص فيتامين ب12 أو حمض الفوليك');
      furtherTests.push('Vitamin B12', 'Folic acid', 'Peripheral blood film', 'Reticulocyte count');
      nutrition.push('مصادر ب12: اللحوم، البيض، الألبان. مصادر الفولات: الخضروات الورقية، البقوليات.');
    } else {
      furtherTests.push('MCV', 'Ferritin', 'Vitamin B12', 'Peripheral blood film');
    }
    if (ferritin && ferritin.eval.status === 'low') {
      interpretations.push('الفيريتين منخفض يؤكد نقص مخزون الحديد.');
      differentials.push('نقص حديد مؤكد');
    }
    redFlags.push('فقر دم شديد (هيموجلوبين منخفض) — تقييم عاجل إذا صاحبه ضيق نفس أو دوخة شديدة أو نزيف.');
  }

  // Infection / inflammation
  if (wbc && wbc.eval.status === 'high') {
    interpretations.push('ارتفاع كرات الدم البيضاء يشير إلى عدوى أو التهاب أو إجهاد فسيولوجي.');

      differentials.push('عدوى فيروسية');

  if ((fbs && fbs.eval.status === 'high') || (hba1c && parseNum(hba1c.value) >= 6.5) || (rbs && parseNum(rbs.value) >= 200)) {

    differentials.push('نقص فيتامين د');
    therapy.push('تعويض فيتامين د حسب المستوى (جرعات علاجية ثم صيانة) بعد استشارة الطبيب.');
    nutrition.push('تعرض معتدل للشمس، أطعمة مدعمة، أسماك دهنية.');
  }
  if (b12 && b12.eval.status === 'low') {
    interpretations.push('نقص فيتامين ب12 قد يسبب فقر دم كبير الكريات واعتلال أعصاب.');
    differentials.push('نقص فيتامين ب12');
    furtherTests.push('Anti-intrinsic factor عند الاشتباه بفقر دم خبيث');
  }

  // PSA
  if (psa && psa.eval.status === 'high') {
    interpretations.push('ارتفاع PSA يستدعي تقييمًا متخصصًا (بروستاتا).');
    differentials.push('تضخم بروستاتا / التهاب / احتمال ورم — يحتاج فحص متخصص');
    furtherTests.push('Free PSA', 'فحص شرجي إصبعي', 'إحالة لمسالك بولية');
  }

  // Troponin
  if (troponin && troponin.eval.status === 'high') {
    redFlags.push('ارتفاع التروبونين يشير لإصابة عضلة القلب — تقييم قلبي عاجل.');
    differentials.push('متلازمة تاجية حادة / إصابة عضلة القلب');
  }

  // Thrombocytopenia
  if (plt && plt.eval.status === 'low') {
    interpretations.push('انخفاض الصفائح يزيد خطر النزيف.');
    differentials.push('نقص صفائح دموية');
    if (parseNum(plt.value) < 50) redFlags.push('صفائح منخفضة جدًا — خطر نزيف، يحتاج تقييم عاجل.');
  }
  if (plt && plt.eval.status === 'high') {
    interpretations.push('ارتفاع الصفائح قد يكون تفاعليًا (التهاب/حديد) أو أوليًا.');
    differentials.push('كثرة صفائح');
  }

  // Symptoms-based hints
  const syms = (d.symptomsSelected || []).join(' ') + ' ' + (d.complaint || '') + ' ' + (d.symptomsDetail || '');
  if (/حمى|سخونة|قشعريرة/.test(syms) && !wbc) furtherTests.push('CBC', 'CRP');
  if (/عطش|تبول كثير|جوع مفرط/.test(syms) && !fbs && !hba1c) furtherTests.push('FBS', 'HbA1c');
  if (/يرقان|اصفرار/.test(syms) && !tbil) furtherTests.push('Total Bilirubin', 'ALT (SGPT)', 'AST (SGOT)');
  if (/ألم صدر|ضيق نفس/.test(syms)) {
    furtherTests.push('Troponin', 'ECG');
    if (/ألم صدر/.test(syms)) redFlags.push('ألم صدر يستدعي استبعاد سبب قلبي عاجل عند وجود عوامل خطر.');
  }

  // Deduplicate
  const uniq = arr => [...new Set(arr.filter(Boolean))];
  const diffList = uniq(differentials);
  const testList = uniq(furtherTests).filter(t => !labMap[t]);
  const flagList = uniq(redFlags);

  // Patient summary
  let summary = 'بناءً على البيانات المدخلة';
  if (abnormal.length === 0 && (d.labs || []).filter(l => l.test).length > 0) {
    summary += '، النتائج المخبرية ضمن المعدلات المرجعية المتاحة.';
  } else if (abnormal.length > 0) {
    summary += '، وُجدت قيم خارج المعدل الطبيعي في: ' + abnormal.map(a => a.nameAr || a.test).join('، ') + '.';
  } else {
    summary += '، لم تُدخل نتائج تحاليل كافية للتقييم المخبري التفصيلي.';
  }
  if (diffList.length) summary += ' الاحتمالات المطروحة تحتاج تأكيد الطبيب.';
  summary += ' هذا الملخص للمساعدة فقط وليس تشخيصًا نهائيًا.';

  // Clinical interpretation
  let clinical = interpretations.length
    ? interpretations.join(' ')
    : 'البيانات المتاحة لا تكفي لبناء تفسير إكلينيكي محدد. يُنصح باستكمال الفحوصات والتاريخ المرضي.';
  if ((d.labs || []).filter(l => l.test && l.value).length === 0) {
    clinical = 'لم تُدخل قيم تحاليل. التفسير يعتمد حاليًا على الأعراض فقط وهو محدود. أدخل نتائج المعمل لدعم أدق.';
  }

  // Therapeutic
  let therapeutic = therapy.length
    ? therapy.join(' ')
    : 'لا توصيات دوائية محددة من البيانات الحالية. أي علاج يجب أن يعتمد على تقييم الطبيب المباشر.';
  therapeutic += ' يُمنع بدء أو تعديل أدوية دون استشارة طبية.';

  // Nutrition
  let nutritional = nutrition.length
    ? nutrition.join(' ')
    : 'اتباع نظام غذائي متوازن، شرب سوائل كافية، ونشاط بدني مناسب للحالة العامة.';

  if (abnormal.length === 0 && normal.length > 0) {
    clinical = 'النتائج المخبرية المدخلة ضمن المعدلات المرجعية المعتمدة. ' + clinical;
  }

  return {
    summary_for_patient: summary,
    clinical_interpretation: clinical,
    differential_diagnosis: diffList.length ? diffList : ['لا يمكن طرح تشخيص تفريقي محدد من البيانات الحالية — يُستكمل التقييم سريريًا'],
    recommended_further_tests: testList.length ? testList : ['متابعة سريرية حسب الأعراض'],
    red_flags: flagList,
    therapeutic_guidance: therapeutic,
    nutritional_guidance: nutritional,
    lab_evaluation: abnormal,
    engine: 'محرك معامل RT المحلي (قواعد طبية احترافية — مجاني وبدون إنترنت)',
    generated_at: new Date().toISOString()
  };
}

/* ========== Optional free AI (Groq / Gemini) ========== */
async function callGroq(promptText) {
  const key = settings.groqKey;
  if (!key) throw Object.assign(new Error('no_key'), { code: 'no_key' });
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      temperature: 0.2,
      max_tokens: 2000,
      messages: [
        { role: 'system', content: 'أنت مساعد إكلينيكي متخصص في تفسير التحاليل المخبرية. أجب JSON فقط.' },
        { role: 'user', content: promptText }
      ]
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw Object.assign(new Error(err?.error?.message || 'groq_failed'), { code: res.status });
  }
  const data = await res.json();
  const text = data.choices?.[0]?.message?.content || '';
  return JSON.parse(text.replace(/```json|```/g, '').trim());
}

async function callGemini(promptText) {
  const key = settings.geminiKey;
  if (!key) throw Object.assign(new Error('no_key'), { code: 'no_key' });
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: { temperature: 0.2, maxOutputTokens: 2000 }
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw Object.assign(new Error(err?.error?.message || 'gemini_failed'), { code: res.status });
  }
  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
  return JSON.parse(text.replace(/```json|```/g, '').trim());
}

function buildAIPrompt(d) {
  const labsText = d.labs.filter(l => l.test).map(l => {
    const ev = evaluateLab(l.test, l.value, d.gender);
    return `- ${l.test}: ${l.value} ${l.unit || ''} ${ev.refText ? `(مرجع: ${ev.refText})` : ''} ${ev.flag ? `[${ev.flag}]` : ''}`;
  }).join('\n') || 'لا توجد تحاليل';
  const medsText = d.meds.filter(m => m.name).map(m => `- ${m.name} ${m.dose} ${m.freq}`).join('\n') || 'لا توجد أدوية';
  return `حلل الحالة كمساعد لطبيب باثولوجيا إكلينيكية. أجب JSON فقط بالمفاتيح:
{
 "summary_for_patient": "شرح مبسط للمريض",
 "clinical_interpretation": "تفسير إكلينيكي للطبيب",
 "differential_diagnosis": ["..."],
 "recommended_further_tests": ["..."],
 "red_flags": ["..."],
 "therapeutic_guidance": "...",
 "nutritional_guidance": "..."
}
السن: ${d.age || 'غير محدد'} | النوع: ${d.gender || 'غير محدد'}
الشكوى: ${d.complaint}
الأعراض: ${(d.symptomsSelected||[]).join('، ') || 'لا يوجد'}
ملاحظات: ${d.symptomsDetail || 'لا يوجد'}
التحاليل:
${labsText}
الأدوية:
${medsText}
إن كانت البيانات ناقصة وضّح ذلك ولا تخمّن.`;
}

/* PWA */
let deferredInstallPrompt = null;
function setupInstallPrompt() {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    showInstallBanner();
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    document.querySelectorAll('.install-banner').forEach(b => b.remove());
  });
}
function showInstallBanner() {
  if (document.querySelector('.install-banner')) return;
  const banner = document.createElement('div');
  banner.className = 'install-banner';
  banner.style.display = 'flex';
  banner.innerHTML = `<span>📱 ثبّت المنصة كتطبيق على الموبايل أو اللابتوب للوصول السريع والعمل دون اتصال</span><button type="button" id="installAppBtn">تثبيت التطبيق</button>`;
  const main = $('#main');
  if (main && main.firstChild) main.insertBefore(banner, main.firstChild);
  else if (main) main.appendChild(banner);
  $('#installAppBtn')?.addEventListener('click', async () => {
    if (!deferredInstallPrompt) {
      alert('للتثبيت: من متصفح Chrome/Edge اختر قائمة ⋮ ثم "تثبيت التطبيق" أو "Install app". على آيفون: مشاركة ← إضافة إلى الشاشة الرئيسية.');
      return;
    }
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    banner.remove();
  });
}
function registerServiceWorker() {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  }
}

function renderCaseList() {

function renderPicker(containerId, dataByGroup, onPick, isSelected) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  Object.keys(dataByGroup).forEach(group => {
    const items = dataByGroup[group];
    const details = document.createElement('details');
    details.className = 'picker-group';
    const selCount = items.filter(isSelected).length;
    details.innerHTML = `<summary>${group} <span class="count">${selCount ? selCount + ' مختار' : items.length + ' عنصر'}</span></summary>
      <div class="picker-options">${items.map(v => `<button type="button" class="pick-chip ${isSelected(v)?'selected':''}" data-v="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('')}</div>`;
    el.appendChild(details);
  });
  $$('.pick-chip', el).forEach(btn => btn.addEventListener('click', () => onPick(btn.dataset.v)));
}

function toggleSymptom(val) {
  const d = currentDraft;
  const i = d.symptomsSelected.indexOf(val);
  if (i === -1) d.symptomsSelected.push(val); else d.symptomsSelected.splice(i, 1);
  renderSymptomChips();
  renderPicker('symptomPicker', SYMPTOMS_BY_SYSTEM, (v) => toggleSymptom(v), (v) => d.symptomsSelected.includes(v));
}

function renderSymptomChips() {
  const d = currentDraft;
  const wrap = $('#symptomChips');
  if (!wrap) return;
  if (!d.symptomsSelected.length) { wrap.innerHTML = '<span class="small-note">لم يتم اختيار أعراض بعد</span>'; return; }
  wrap.innerHTML = d.symptomsSelected.map((v, i) => `<span class="selected-chip">${escapeHtml(v)}<button type="button" data-i="${i}">×</button></span>`).join('');
  $$('#symptomChips button').forEach(btn => btn.addEventListener('click', () => {
    d.symptomsSelected.splice(+btn.dataset.i, 1); renderSymptomChips();
    renderPicker('symptomPicker', SYMPTOMS_BY_SYSTEM, (v) => toggleSymptom(v), (v) => d.symptomsSelected.includes(v));
  }));
}

function quickAddMed(name) {
  currentDraft.meds.push({ name, dose: '', freq: '' });
  renderMedRows(currentDraft.meds);
}

function quickAddLab(name) {
  const d = currentDraft;
  if (d.labs.some(l => l.test === name)) return;
  if (d.labs.length === 1 && !d.labs[0].test) d.labs = [];
  const ref = getRefFor(name, d.gender || $('#f_gender')?.value);
  d.labs.push({
    test: name,
    value: '',
    unit: ref ? ref.unit : '',
    ref: ref ? `${ref.low} – ${ref.high}` : ''
  });
  renderLabRows(d.labs);
  renderPicker('labPicker', LABS_BY_CATEGORY, (v) => quickAddLab(v), (v) => d.labs.some(l => l.test === v));
}

function renderLabRows(labs) {
  const tbody = $('#labsTable tbody');
  if (!tbody) return;
  tbody.innerHTML = '';
  labs.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(row.test)}" data-f="test" data-i="${i}" placeholder="التحليل"></td>
      <td><input type="text" value="${escapeHtml(row.value)}" data-f="value" data-i="${i}" placeholder="القيمة"></td>
      <td><input type="text" value="${escapeHtml(row.unit)}" data-f="unit" data-i="${i}" placeholder="الوحدة"></td>
      <td><input type="text" value="${escapeHtml(row.ref)}" data-f="ref" data-i="${i}" placeholder="المعدل"></td>
      <td>${labs.length > 1 ? `<button type="button" class="row-remove" data-i="${i}">×</button>` : ''}</td>`;
    tbody.appendChild(tr);
  });
  $$('#labsTable input').forEach(inp => inp.addEventListener('input', e => {
    labs[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
  }));
  $$('#labsTable .row-remove').forEach(btn => btn.addEventListener('click', e => {
    labs.splice(+e.target.dataset.i, 1); renderLabRows(labs);
  }));
}

function renderMedRows(meds) {
  const tbody = $('#medsTable tbody');
  if (!tbody) return;
  tbody.innerHTML = '';
  meds.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(row.name)}" data-f="name" data-i="${i}" placeholder="اسم الدواء"></td>
      <td><input type="text" value="${escapeHtml(row.dose)}" data-f="dose" data-i="${i}" placeholder="الجرعة"></td>
      <td><input type="text" value="${escapeHtml(row.freq)}" data-f="freq" data-i="${i}" placeholder="مرات الاستخدام"></td>
      <td>${meds.length > 1 ? `<button type="button" class="row-remove" data-i="${i}">×</button>` : ''}</td>`;
    tbody.appendChild(tr);
  });
  $$('#medsTable input').forEach(inp => inp.addEventListener('input', e => {
    meds[+e.target.dataset.i][e.target.dataset.f] = e.target.value;
  }));
  $$('#medsTable .row-remove').forEach(btn => btn.addEventListener('click', e => {
    meds.splice(+e.target.dataset.i, 1); renderMedRows(meds);
  }));
}

function renderAttachments(list) {
  const wrap = $('#attachmentsList');
  if (!wrap) return;
  wrap.innerHTML = '';
  list.forEach((a, i) => {
    const chip = document.createElement('div');
    chip.className = 'attachment-chip';
    chip.innerHTML = `<a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a> <button type="button" class="row-remove" data-i="${i}" style="font-size:14px;">×</button>`;
    wrap.appendChild(chip);
  });
  $$('#attachmentsList .row-remove').forEach(btn => btn.addEventListener('click', e => {
    currentDraft.attachments.splice(+e.target.dataset.i, 1);
    renderAttachments(currentDraft.attachments);
  }));
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function handleFileUpload(e) {
  const files = Array.from(e.target.files || []);
  for (const file of files) {
    if (file.size > 4 * 1024 * 1024) {
      alert(`الملف "${file.name}" أكبر من 4 ميجا`);
      continue;
    }
    try {
      const dataUrl = await fileToDataUrl(file);
      currentDraft.attachments.push({ url: dataUrl, name: file.name, contentType: file.type });
    } catch (err) { console.error(err); }
  }
  renderAttachments(currentDraft.attachments);
  e.target.value = '';
}

async function generateReport() {
  const d = currentDraft;
  d.patientCode = $('#f_code').value;
  d.age = $('#f_age').value;
  d.gender = $('#f_gender').value;
  d.complaint = $('#f_complaint').value;
  d.symptomsDetail = $('#f_symptoms').value;

  if (!d.complaint && !d.symptomsDetail && !d.symptomsSelected.length && !(d.labs||[]).some(l => l.test && l.value)) {
    alert('برجاء إدخال الشكوى أو عرض أو نتيجة تحليل واحدة
    return;
  }

  const genBtn = $('#generateBtn');
  genBtn.disabled = true;
  const statusEl = $('#genStatus');
  statusEl.innerHTML = `<div class="loading-line"><div class="spinner"></div> جارٍ تحليل الحالة وتوليد التقرير…</div>`;

  try {
    let result;
    if (settings.engine === 'local') {
      result = buildLocalReport(d);
    } else if (settings.engine === 'groq') {
      if (!settings.groqKey) { openSettingsModal(); throw Object.assign(new Error('no_key'), { code: 'no_key' }); }
      result = await callGroq(buildAIPrompt(d));
      result.engine = 'Groq AI (Llama)';
      // merge local lab flags
      const local = buildLocalReport(d);
      result.lab_evaluation = local.lab_evaluation;
      result.red_flags = [...new Set([...(result.red_flags||[]), ...(local.red_flags||[])])];
    } else if (settings.engine === 'gemini') {
      if (!settings.geminiKey) { openSettingsModal(); throw Object.assign(new Error('no_key'), { code: 'no_key' }); }
      result = await callGemini(buildAIPrompt(d));
      result.engine = 'Google Gemini';
      const local = buildLocalReport(d);
      result.lab_evaluation = local.lab_evaluation;
      result.red_flags = [...new Set([...(result.red_flags||[]), ...(local.red_flags||[])])];
    } else {
      result = buildLocalReport(d);
    }

    d.report = result;
    d.status = 'pending';
    d.createdAt = d.createdAt || Date.now();
    await saveCase(d);
    genBtn.disabled = false;
    statusEl.innerHTML = '';
    renderCaseView(currentCaseId);
    renderCaseList();
  } catch (err) {
    console.error(err);
    genBtn.disabled = false;
    let msg = 'تعذر توليد التقرير، حاول مرة أخرى';
    if (err.code === 'no_key' || err.code === 401) msg = 'مفتاح API غير موجود أو غير صالح — راجع الإعدادات أو استخدم المحرك المحلي المجاني';
    else if (err.code === 429) msg = 'تم تجاوز حد الطلبات المجانية، حاول لاحقًا أو استخدم المحرك المحلي';
    statusEl.innerHTML = `<div class="loading-line" style="color:var(--danger)">${msg}</div>`;
  }
}

async function saveCase(d) {
  const id = currentCaseId || uid();
  currentCaseId = id;
  cases[id] = JSON.parse(JSON.stringify(d));
  persistCasesToStorage();
}

function renderCaseView(id) {
  const c = cases[id];
  if (!c) return;
  const main = $('#main');
  const r = c.report;

  const labsText = (c.labs||[]).filter(l => l.test).map(l => {
    const ev = evaluateLab(l.test, l.value, c.gender);
    const flagHtml = ev.flag ? `<span class="lab-flag ${ev.status}">${ev.flag}</span>` : '';
    return `<tr><td>${escapeHtml(l.test)} ${flagHtml}</td><td>${escapeHtml(l.value)} ${escapeHtml(l.unit||'')}</td><td>${escapeHtml(l.ref || ev.refText || '')}</td></tr>`;
  }).join('');
  const medsText = (c.meds||[]).filter(m => m.name).map(m => `<li>${escapeHtml(m.name)} — ${escapeHtml(m.dose)} ${escapeHtml(m.freq)}</li>`).join('');

  main.innerHTML = `
    <div class="report-header">
      <div>
        <h2 class="serif" style="margin-bottom:4px;">${escapeHtml(c.patientCode || 'حالة بدون كود')}</h2>
        <div class="patient-tag">${c.age ? 'السن: '+escapeHtml(c.age)+' · ' : ''}${escapeHtml(c.gender||'')} · ${escapeHtml(settings.labName)}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn-pdf" id="pdfBtn">📄 حفظ PDF</button>
        <button type="button" class="btn-secondary" id="backBtn">+ حالة جديدة</button>
      </div>
    </div>

    <div id="reportPrintArea">
    <div class="card">
      <h2 class="serif" style="font-size:17px;">الشكوى والبيانات المدخلة</h2>
      <p><b>الشكوى:</b> ${escapeHtml(c.complaint)}</p>
      ${(c.symptomsSelected&&c.symptomsSelected.length) ? `<p><b>الأعراض:</b> ${c.symptomsSelected.map(escapeHtml).join('، ')}</p>` : ''}
      ${c.symptomsDetail ? `<p>${escapeHtml(c.symptomsDetail)}</p>` : ''}
      ${labsText ? `<div class="table-wrap" style="margin-top:10px;"><table><thead><tr><th>التحليل</th><th>القيمة</th><th>المعدل</th></tr></thead><tbody>${labsText}</tbody></table></div>` : ''}
      ${medsText ? `<div style="margin-top:12px;"><b>الأدوية:</b><ul>${medsText}</ul></div>` : ''}
    </div>

    ${r ? `
    <div class="card">
      <div class="engine-badge">✓ ${escapeHtml(r.engine || 'محرك التشخيص')}</div>
      <div class="disclaimer">هذا التقرير أُنشئ كأداة دعم قرار إكلينيكي لمعامل RT، ويجب مراجعته واعتماده من الطبيب المختص قبل الاعتماد عليه أو مشاركته مع المريض. لا يُعد بديلاً عن التقييم الطبي المباشر.</div>

      ${r.red_flags && r.red_flags.length ? `<div class="report-section"><h3 class="serif">علامات تستدعي انتباهًا عاجلاً</h3><div class="flag-list">${r.red_flags.map(f=>`<div class="flag-item">${escapeHtml(f)}</div>`).join('')}</div></div>` : ''}

      ${r.lab_evaluation && r.lab_evaluation.length ? `<div class="report-section"><h3 class="serif">تقييم النتائج المخبرية</h3>${r.lab_evaluation.map(a=>`<div class="abnormal-item"><b>${escapeHtml(a.nameAr||a.test)}</b>: ${escapeHtml(a.value)} ${escapeHtml(a.unit||'')} — <b>${escapeHtml(a.flag)}</b> (المرجع: ${escapeHtml(a.ref||'')})</div>`).join('')}</div>` : ''}

      <div class="report-section"><h3 class="serif">شرح الحالة للمريض</h3><p>${escapeHtml(r.summary_for_patient||'')}</p></div>
      <div class="report-section"><h3 class="serif">التفسير الإكلينيكي</h3><p>${escapeHtml(r.clinical_interpretation||'')}</p></div>
      ${r.differential_diagnosis && r.differential_diagnosis.length ? `<div class="report-section"><h3 class="serif">التشخيص التفريقي المحتمل</h3><ul>${r.differential_diagnosis.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : ''}
      ${r.recommended_further_tests && r.recommended_further_tests.length ? `<div class="report-section"><h3 class="serif">فحوصات مقترحة</h3><ul>${r.recommended_further_tests.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="report-section"><h3 class="serif">التوجيه العلاجي المبدئي</h3><p>${escapeHtml(r.therapeutic_guidance||'')}</p></div>
      <div class="report-section"><h3 class="serif">التوصيات الغذائية</h3><p>${escapeHtml(r.nutritional_guidance||'')}</p></div>

      <div class="review-bar">
        <div class="review-status ${c.status==='reviewed'?'reviewed':'pending'}">
          ${c.status==='reviewed' ? '✓ تمت مراجعة هذا التقرير واعتماده' + (settings.doctorName ? ' — د. ' + escapeHtml(settings.doctorName) : '') : 'بانتظار مراجعة الطبيب واعتماد التقرير'}
        </div>
        ${c.status!=='reviewed' ? `<button type="button" class="btn-primary" id="reviewBtn">اعتماد التقرير بعد المراجعة</button>` : ''}
      </div>
      <div class="small-note" style="margin-top:12px;">${escapeHtml(settings.labName)} · منصة التشخيص الذكي · ${new Date(c.createdAt||Date.now()).toLocaleString('ar-EG')}</div>
    </div>
    ` : `<div class="card"><p class="small-note">لم يتم توليد تقرير بعد.</p></div>`}
    </div>
  `;

  $('#backBtn').addEventListener('click', () => {
    currentCaseId = null; currentDraft = emptyDraft(); renderMainForm(); renderCaseList();
  });
  $('#pdfBtn')?.addEventListener('click', () => exportPDF(c));
  const reviewBtn = $('#reviewBtn');
  if (reviewBtn) reviewBtn.addEventListener('click', async () => {
    c.status = 'reviewed';
    c.reviewedAt = Date.now();
    await saveCase(c);
    renderCaseView(id);
    renderCaseList();
  });
}

function exportPDF(c) {
  const el = document.getElementById('reportPrintArea');
  if (!el) return;
  const name = (c.patientCode || 'report').replace(/[^\w\u0600-\u06FF\-]+/g, '_');
  const opt = {
    margin: [10, 10, 10, 10],
    filename: `RT_Labs_${name}_${new Date().toISOString().slice(0,10)}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
  };
  const btn = $('#pdfBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'جاري التصدير…'; }
  html2pdf().set(opt).from(el).save().then(() => {
    if (btn) { btn.disabled = false; btn.textContent = '📄 حفظ PDF'; }
  }).catch(() => {
    if (btn) { btn.disabled = false; btn.textContent = '📄 حفظ PDF'; }
    alert('تعذر تصدير PDF — جرّب مرة أخرى أو استخدم طباعة المتصفح');
  });
}

init();
</script>
